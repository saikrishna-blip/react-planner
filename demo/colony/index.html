<title>Sullurpeta Design Colony</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
  /* Layout: header with design picker + time of day, full-bleed 3D street, then the selected design's card and the catalogue grid */
  :root {
    --bg: #f4f2ee; --surface: #ffffff; --fg: #1f1d1b; --muted: #625b54; --line: #e3ddd5;
    --accent: #8f5636; --accent-fg: #ffffff; --accent-soft: #f2e5db; --chip: #ebe6df;
    --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
    --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #171513; --surface: #211e1b; --fg: #efe9e2; --muted: #a79d92; --line: #36312c;
    --accent: #d39068; --accent-fg: #171513; --accent-soft: #3a2a20; --chip: #2b2723; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #171513; --surface: #211e1b; --fg: #efe9e2; --muted: #a79d92; --line: #36312c;
    --accent: #d39068; --accent-fg: #171513; --accent-soft: #3a2a20; --chip: #2b2723; color-scheme: dark }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
  .wrap { max-width: 1240px; margin: 0 auto; padding-block: 20px 44px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; gap: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
  h1 { font-family: var(--font-display); font-size: 26px; line-height: 1.15; margin: 0; text-wrap: balance; }
  h2 { font-family: var(--font-display); font-size: 19px; margin: 0; }
  .eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 3px; }
  .sub { color: var(--muted); margin: 4px 0 0; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  select { font: 500 14px var(--font-body); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; max-width: 100%; }
  .seg { display: inline-flex; background: var(--chip); border-radius: 999px; padding: 3px; gap: 2px; }
  .seg button, .navbtn { border: 0; background: transparent; color: var(--fg); font: 500 13px var(--font-body); padding: 7px 13px; border-radius: 999px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
  .navbtn { background: var(--chip); }
  button:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .stage { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 72vh; border-radius: 14px; overflow: hidden; background: #a9c4dc; }
  .stage canvas { display: block; width: 100% !important; height: 100% !important; touch-action: none; }
  .views { position: absolute; right: 10px; top: 10px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: end; }
  .views button { border: 0; font: 500 12px var(--font-body); padding: 6px 11px; border-radius: 999px; cursor: pointer; background: rgba(255,255,255,.9); color: #1f2124; }
  .tag { position: absolute; left: 12px; top: 10px; background: rgba(20,18,16,.72); color: #fff; padding: 6px 12px; border-radius: 10px; font-size: 13px; pointer-events: none; }
  .tag b { font-family: var(--font-display); }
  .hint { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: #fff; background: rgba(0,0,0,.45); padding: 4px 10px; border-radius: 999px; pointer-events: none; }
  .err { position: absolute; inset: 0; display: grid; place-items: center; color: #1f2124; font-weight: 500; text-align: center; padding: 20px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; min-width: 0; }
  .detail { display: grid; grid-template-columns: 1.2fr 1fr; gap: 18px; }
  @media (max-width: 820px) { .detail { grid-template-columns: 1fr; } }
  .code { display: inline-block; font: 600 12px var(--font-display); background: var(--chip); padding: 2px 8px; border-radius: 6px; margin-right: 6px; vertical-align: 2px; }
  .desc { margin: 8px 0 0; max-width: 65ch; }
  .feat { margin: 10px 0 0; padding-left: 18px; color: var(--muted); font-size: 14px; display: grid; gap: 3px; }
  .sw { display: grid; grid-template-columns: 26px 1fr auto; gap: 4px 10px; align-items: center; font-size: 14px; }
  .sw i { width: 26px; height: 22px; border-radius: 6px; border: 1px solid rgba(0,0,0,.12); display: block; }
  .sw span:last-child { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .links a { font-size: 13px; font-weight: 500; text-decoration: none; color: var(--accent); background: var(--accent-soft); padding: 5px 10px; border-radius: 999px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .item { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; color: var(--fg); font: inherit; display: grid; gap: 6px; min-width: 0; }
  .item[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .item .nm { font-family: var(--font-display); font-weight: 600; }
  .item .st { font-size: 12px; color: var(--muted); }
  .chips { display: flex; gap: 4px; }
  .chips i { width: 18px; height: 18px; border-radius: 5px; border: 1px solid rgba(0,0,0,.12); display: block; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">Same plan P5 on every plot · 24' × 60' · Sullurpeta</p>
      <h1>Sullurpeta Design Colony</h1>
      <p class="sub">Nine exterior designs for your house, side by side on one street. Pick a design or view the whole colony.</p>
    </div>
    <div class="controls">
      <button class="navbtn" id="prev" aria-label="Previous design">‹</button>
      <label class="eyebrow" for="design" style="margin:0">Design</label>
      <select id="design"></select>
      <button class="navbtn" id="next" aria-label="Next design">›</button>
      <div class="seg" role="group" aria-label="Time of day">
        <button id="btn-day" aria-pressed="true">Day</button>
        <button id="btn-dusk" aria-pressed="false">Dusk</button>
        <button id="btn-night" aria-pressed="false">Night</button>
      </div>
    </div>
  </header>

  <div class="stage" id="stage">
    <div class="tag" id="tag"></div>
    <div class="views">
      <button data-view="front">Front</button>
      <button data-view="corner">Corner</button>
      <button data-view="entry">Entrance</button>
      <button data-view="colony">Whole colony</button>
    </div>
    <div class="hint">Drag to rotate · scroll or pinch to zoom</div>
  </div>

  <section class="card detail" aria-live="polite">
    <div>
      <p class="eyebrow" id="d-style"></p>
      <h2><span class="code" id="d-code"></span><span id="d-name"></span></h2>
      <p class="desc" id="d-desc"></p>
      <ul class="feat" id="d-feat"></ul>
      <div class="links" id="d-links"></div>
    </div>
    <div>
      <p class="eyebrow">Colour & material palette</p>
      <div class="sw" id="d-sw"></div>
    </div>
  </section>

  <section>
    <p class="eyebrow">Collection</p>
    <div class="grid" id="grid"></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script>
(function () {
  const stage = document.getElementById('stage');
  if (!window.THREE) { stage.insertAdjacentHTML('beforeend', '<div class="err">The 3D library could not load. Check your connection and reload the page.</div>'); return; }

  // ================= renderer / scene =================
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping;
  stage.prepend(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, 1.7, 0.5, 1500);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.495; controls.minDistance = 6; controls.maxDistance = 480;

  // plan coords (ft): x 0..24 across a plot (left→right from the road), y 0..60 from the road, z up. OX = plot offset.
  let OX = 0;
  const W = (x) => x - 12 + OX, D = (y) => 22 - y;
  const lin = (hex) => new THREE.Color(hex).convertSRGBToLinear();
  const mat = (o) => { if (o.color) o.color = lin(o.color); return new THREE.MeshStandardMaterial(Object.assign({ roughness: 0.85, metalness: 0 }, o)); };
  const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();

  // ================= textures =================
  function canvasTex(w, h, draw, rx, ry) {
    const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx || 1, ry || 1);
    t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t;
  }
  const TX = {};
  TX.plaster = canvasTex(128, 128, (g, w, h) => { g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); for (let i = 0; i < 1400; i++) { g.fillStyle = `rgba(0,0,0,${rnd() * 0.035})`; g.fillRect(rnd() * w, rnd() * h, 1.5, 1.5); } }, 4, 4);
  TX.wood = canvasTex(128, 512, (g, w, h) => {
    g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 160; i++) { const x = rnd() * w; g.strokeStyle = `rgba(0,0,0,${0.05 + rnd() * 0.12})`; g.lineWidth = 0.5 + rnd() * 1.5; g.beginPath(); g.moveTo(x, 0); g.bezierCurveTo(x + rnd() * 6 - 3, h / 3, x + rnd() * 6 - 3, 2 * h / 3, x + rnd() * 4 - 2, h); g.stroke(); }
    for (let x = 0; x < w; x += 16) { g.fillStyle = 'rgba(0,0,0,.22)'; g.fillRect(x, 0, 1.5, h); }
  }, 1, 1);
  TX.woodW = TX.wood.clone(); TX.woodW.needsUpdate = true; TX.woodW.repeat.set(0.35, 0.35);
  TX.ledger = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#5b5e61'; g.fillRect(0, 0, w, h);
    for (let y = 0; y < h; y += 10 + rnd() * 8) for (let x = 0; x < w;) { const len = 30 + rnd() * 70, v = 70 + rnd() * 40; g.fillStyle = `rgb(${v},${v + 3},${v + 6})`; g.fillRect(x, y, len - 2, 8 + rnd() * 6); x += len; }
  }, 1, 3);
  TX.block = canvasTex(512, 512, (g, w, h) => {      // 2 ft x 1 ft blocks, 512 px = 4 ft (world UV)
    g.fillStyle = '#6e6e6e'; g.fillRect(0, 0, w, h);
    for (let r = 0; r < 4; r++) for (let c = -1; c < 3; c++) { const x = c * 256 + (r % 2 ? 128 : 0), y = r * 128, v = 190 + rnd() * 55;
      g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(x + 3, y + 3, 250, 122);
      for (let k = 0; k < 260; k++) { const d = rnd() * 40 - 20; g.fillStyle = `rgba(${v + d},${v + d},${v + d},.7)`; g.fillRect(x + 3 + rnd() * 246, y + 3 + rnd() * 118, 3, 3); } }
  }, 0.25, 0.25);
  TX.ashlar = canvasTex(384, 384, (g, w, h) => {     // 1.5 ft x 0.75 ft dressed stone, 384 px = 3 ft (world UV)
    g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
    for (let r = 0; r < 4; r++) for (let c = -1; c < 3; c++) { const x = c * 192 + (r % 2 ? 96 : 0), y = r * 96, v = 205 + rnd() * 35;
      g.fillStyle = `rgb(${v},${v - 2},${v - 4})`; g.fillRect(x + 3, y + 3, 186, 90);
      for (let k = 0; k < 140; k++) { const d = rnd() * 26 - 13; g.fillStyle = `rgba(${v + d},${v + d},${v + d},.55)`; g.fillRect(x + 4 + rnd() * 182, y + 4 + rnd() * 84, 2, 2); } }
  }, 1 / 3, 1 / 3);
  TX.jali = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#efe7da'; g.fillRect(0, 0, w, h); const n = 4, c = w / n;
    for (let i = 0; i < n; i++) for (let k = 0; k < n; k++) { const cx = i * c + c / 2, cy = k * c + c / 2; g.fillStyle = '#7d6a58';
      for (let a = 0; a < 8; a++) { const t = a * Math.PI / 4; g.beginPath(); g.ellipse(cx + Math.cos(t) * c * 0.22, cy + Math.sin(t) * c * 0.22, c * 0.14, c * 0.06, t, 0, Math.PI * 2); g.fill(); }
      g.beginPath(); g.arc(cx, cy, c * 0.07, 0, Math.PI * 2); g.fill(); g.beginPath(); g.arc(i * c, k * c, c * 0.1, 0, Math.PI * 2); g.fill(); }
  }, 1, 1);
  TX.wave = canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); const N = 22;
    for (let i = 0; i < N; i++) { const v = i % 2 ? 210 : 250; g.fillStyle = `rgb(${v},${v},${v})`; g.beginPath();
      for (let x = 0; x <= w; x += 8) { const y = (i / N) * h + Math.sin(x / w * Math.PI * 2.2 + i * 0.32) * 26; x ? g.lineTo(x, y) : g.moveTo(x, y); }
      for (let x = w; x >= 0; x -= 8) { const y = ((i + 1) / N) * h + Math.sin(x / w * Math.PI * 2.2 + (i + 1) * 0.32) * 26; g.lineTo(x, y); }
      g.closePath(); g.fill(); }
  }, 1, 1);
  TX.roof = canvasTex(256, 256, (g, w, h) => {       // clay roof tiles, 256 px = 4 ft (world UV)
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
    for (let r = 0; r < 8; r++) for (let c = 0; c < 9; c++) { const x = c * 32 - (r % 2 ? 16 : 0), y = r * 32, v = 200 + rnd() * 50;
      const gr = g.createLinearGradient(0, y, 0, y + 32); gr.addColorStop(0, `rgb(${v},${v},${v})`); gr.addColorStop(1, `rgb(${v - 70},${v - 70},${v - 70})`);
      g.fillStyle = gr; g.fillRect(x + 1, y, 30, 31); }
  }, 0.25, 0.25);
  TX.marble = canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = '#f6f6f4'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 26; i++) { g.strokeStyle = `rgba(110,110,120,${0.08 + rnd() * 0.18})`; g.lineWidth = 0.6 + rnd() * 2.2; g.beginPath(); let x = rnd() * w, y = 0; g.moveTo(x, y);
      while (y < h) { x += rnd() * 30 - 15; y += 10 + rnd() * 20; g.lineTo(x, y); } g.stroke(); }
    g.strokeStyle = 'rgba(0,0,0,.08)'; g.lineWidth = 2; g.strokeRect(1, 1, w - 2, h - 2);
  }, 0.25, 0.25);
  TX.athangudi = canvasTex(256, 256, (g, w, h) => {
    const cols = ['#b2482f', '#e7d8b4', '#2f5b55', '#d39a3b'];
    for (let i = 0; i < 4; i++) for (let k = 0; k < 4; k++) { const x = i * 64, y = k * 64; g.fillStyle = cols[(i + k) % 2 ? 1 : 0]; g.fillRect(x, y, 64, 64);
      g.fillStyle = cols[2]; g.beginPath(); g.arc(x + 32, y + 32, 20, 0, Math.PI * 2); g.fill(); g.fillStyle = cols[3]; g.beginPath(); g.arc(x + 32, y + 32, 9, 0, Math.PI * 2); g.fill();
      g.strokeStyle = 'rgba(0,0,0,.25)'; g.strokeRect(x, y, 64, 64); }
  }, 2, 2);
  TX.green = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#2f5a2a'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 900; i++) { const v = rnd(); g.fillStyle = `rgba(${40 + v * 80},${100 + v * 90},${30 + v * 40},.85)`; g.beginPath(); g.ellipse(rnd() * w, rnd() * h, 4 + rnd() * 6, 2 + rnd() * 3, rnd() * 3, 0, Math.PI * 2); g.fill(); }
  }, 1, 2);
  TX.tile = canvasTex(256, 256, (g, w, h) => { g.fillStyle = '#f1efea'; g.fillRect(0, 0, w, h); g.strokeStyle = '#c9c5bd'; g.lineWidth = 3;
    for (let i = 0; i <= 2; i++) { g.beginPath(); g.moveTo(i * 128, 0); g.lineTo(i * 128, h); g.stroke(); g.beginPath(); g.moveTo(0, i * 128); g.lineTo(w, i * 128); g.stroke(); } }, 2.5, 2.5);
  TX.paver = canvasTex(256, 256, (g, w, h) => { g.fillStyle = '#b8b2a8'; g.fillRect(0, 0, w, h);
    for (let y = 0; y < h; y += 32) for (let x = (y / 32) % 2 ? 0 : -32; x < w; x += 64) { const v = 165 + rnd() * 25; g.fillStyle = `rgb(${v},${v - 4},${v - 12})`; g.fillRect(x + 2, y + 2, 60, 28); } }, 6, 2);
  TX.grass = canvasTex(256, 256, (g, w, h) => { g.fillStyle = '#5f8a3e'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 3000; i++) { const v = rnd(); g.fillStyle = `rgba(${40 + v * 60},${90 + v * 70},${30 + v * 30},.6)`; g.fillRect(rnd() * w, rnd() * h, 2, 2); } }, 60, 60);
  TX.plate = canvasTex(512, 256, (g, w, h) => { g.fillStyle = '#f7f5f0'; g.fillRect(0, 0, w, h); g.fillStyle = '#5a5248';
    g.font = 'italic 600 78px Georgia, serif'; g.textAlign = 'center'; g.fillText('House', w / 2, 110); g.font = 'italic 600 62px Georgia, serif'; g.fillText('No.', w / 2, 196); }, 1, 1);

  // ================= shared materials =================
  const S = {
    glass: new THREE.MeshStandardMaterial({ color: lin('#4a5b68'), roughness: 0.12, metalness: 0.55, emissive: lin('#e8a35a'), emissiveIntensity: 0 }),
    lampOn: new THREE.MeshStandardMaterial({ color: lin('#2a2c2f'), emissive: lin('#ffb45e'), emissiveIntensity: 0 }),
    lantern: new THREE.MeshStandardMaterial({ color: lin('#ffe2b0'), emissive: lin('#ffb45e'), emissiveIntensity: 0.15, roughness: 0.4 }),
    paver: mat({ map: TX.paver }), soil: mat({ color: '#4a3525' }), leaf: mat({ color: '#3f7a35', roughness: 0.8 }), leaf2: mat({ color: '#6aa346', roughness: 0.8 }),
    stone: mat({ map: TX.ledger, roughness: 0.95 }), tile: mat({ map: TX.tile, roughness: 0.5 }), trunk: mat({ color: '#7a6248', roughness: 0.9 }),
    frond: mat({ color: '#4f8a3a', roughness: 0.8 }), tank: mat({ color: '#e9e6e0', roughness: 0.6 }), green: mat({ map: TX.green, roughness: 0.9 }),
    plate: new THREE.MeshStandardMaterial({ map: TX.plate, emissiveMap: TX.plate, emissive: lin('#ffd9a0'), emissiveIntensity: 0, roughness: 0.6 }),
    athangudi: mat({ map: TX.athangudi, roughness: 0.35 })
  };
  let M = S;
  function makeMats(p) {
    const clad = { block: TX.block, ashlar: TX.ashlar, marble: TX.marble }[p.cladTex || 'ashlar'];
    return Object.assign({}, S, {
      body: mat({ map: TX.plaster, color: p.body }), frame: mat({ map: TX.plaster, color: p.frame }), recess: mat({ map: p.recessTex ? TX[p.recessTex] : TX.plaster, color: p.recess || p.body }),
      plinth: mat({ color: p.plinth, roughness: 0.7 }), compound: mat({ map: TX.plaster, color: p.compound || p.body }), coping: mat({ color: p.coping || p.plinth, roughness: 0.6 }),
      metal: mat({ color: p.metal, roughness: 0.45, metalness: 0.6 }), wood: mat({ map: TX.wood, color: p.wood, roughness: 0.6 }), woodW: mat({ map: TX.woodW, color: p.wood, roughness: 0.6 }),
      clad: mat({ map: clad, color: p.clad || p.body, roughness: p.cladTex === 'marble' ? 0.3 : 0.9 }), accent: mat({ color: p.accent || p.metal, roughness: p.accentRough ?? 0.4, metalness: p.accentMetal ?? 0.5 }),
      slab: mat({ map: TX.plaster, color: p.slab || p.frame }), dome: mat({ color: p.frame, roughness: 0.35 }), jali: mat({ map: TX.jali, color: p.clad || p.body }),
      roof: mat({ map: TX.roof, color: p.roof || '#b5532f', roughness: 0.8 }), marble: mat({ map: TX.marble, color: p.marble || '#ffffff', roughness: 0.25 }),
      shutter: mat({ map: TX.wood, color: p.shutter || p.wood, roughness: 0.6 }), granite: mat({ color: p.granite || '#3d3c3a', roughness: 0.5 })
    });
  }

  // ================= builders (add to current house group G) =================
  let G = scene, RIG = [];
  function box(x0, x1, y0, y1, z0, z1, m, cast = true) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(Math.abs(x1 - x0), Math.abs(z1 - z0), Math.abs(y1 - y0)), m);
    mesh.position.set(W((x0 + x1) / 2), (z0 + z1) / 2, D((y0 + y1) / 2)); mesh.castShadow = cast; mesh.receiveShadow = m !== S.glass; G.add(mesh); return mesh;
  }

      box(4.6, 8.0, 9.45, 9.62, 0.3, 10.2, M.wood); box(7.4, 7.5, 9.38, 9.45, 3.0, 7.5, M.accent);
      box(3, 10, 4.0, 9.6, 0, 0.3, M.marble);
      // front block: marble skin, slot window, backlit brass jali on the solid stair wall
      cbox(10.4, 21.2, 5.65, 6.05, 0, PZ + PH); box(10.4, 21.2, 5.5, 6.05, PZ + PH, PZ + PH + 0.15, M.accent);
      box(11.0, 15.4, 5.55, 5.62, 4.0, 9.0, S.glass); box(10.8, 15.6, 5.45, 5.65, 9.0, 9.2, M.accent); box(10.8, 15.6, 5.45, 5.65, 3.8, 4.0, M.accent);
      box(10.8, 11.0, 5.45, 5.65, 3.8, 9.2, M.accent); box(15.4, 15.6, 5.45, 5.65, 3.8, 9.2, M.accent);
      box(16.2, 20.7, 5.55, 5.65, 1.4, 12.8, S.lampOn); box(16.2, 20.7, 5.4, 5.48, 1.4, 12.8, M.jali);
      box(16.0, 20.9, 5.3, 5.65, 12.8, 13.05, M.accent); box(16.0, 20.9, 5.3, 5.65, 1.15, 1.4, M.accent); box(16.0, 16.2, 5.3, 5.65, 1.15, 13.05, M.accent); box(20.7, 20.9, 5.3, 5.65, 1.15, 13.05, M.accent);
      box(2.6, 10.4, 4.6, 4.72, PZ + 0.2, PZ + 3.4, S.glass); box(2.6, 3.1, 4.4, 9.6, PZ, PZ + PH, M.body);
      box(12.6, 21, 3.4, 5.4, 0, 1.2, M.plinth); box(12.9, 20.7, 3.7, 5.1, 0, 1.25, S.soil, false); shrubs(13.2, 20.4, 3.9, 4.9, 1.3, 10);
      // lights
      [3.1, 9.9].forEach((x) => spot(x, 4.2, 0.2, x, 4.6, 13, 20, 0.2, 16)); [5.2, 7.4].forEach((x) => spot(x, 7.8, ROOF - 0.1, x, 9.3, 1, 16, 0.6, 12));
      box(3.65, 9.35, 4.36, 4.4, 12.9, 12.95, S.lampOn, false); point(18.45, 4.9, 7.0, 6, 9); spot(13.2, 4.6, 0.3, 13.2, 5.6, 9, 12, 0.5, 10);
      [0.6, 11.25].forEach((x) => point(x, -0.3, 5.0, 4, 7));
    } });

  // ================= build the street =================
  const N = DESIGNS.length, PLOT = 24;
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), mat({ map: TX.grass })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  OX = 0; M = S; G = scene;
  const half = (N * PLOT) / 2 + 30;
  box(-half + 12, half + 12, -30, -2, -0.05, 0.02, mat({ color: '#4b4d50', roughness: 0.95 }), false);
  box(-half + 12, half + 12, -2, 0, 0, 0.35, mat({ color: '#8d8f91', roughness: 0.9 }), false);
  box(-half + 12, half + 12, -16.2, -15.8, 0.03, 0.04, mat({ color: '#e8e2c8' }), false);           // road centre line
  const streetRig = [];
  for (let i = 0; i <= N; i += 2) {                                                                // street lights between plots
    OX = (i - N / 2) * PLOT - 12;
    box(11.85, 12.15, -2.6, -2.3, 0, 13, mat({ color: '#3a3c3f', metalness: 0.5, roughness: 0.4 }), true); box(11.8, 13.6, -2.7, -2.2, 13, 13.25, mat({ color: '#3a3c3f' })); lamp(13.2, -2.45, 12.85, 0.25);
    const l = new THREE.PointLight(WARM, 0, 40, 2); l.position.set(W(13.2), 12.4, D(-2.6)); scene.add(l); streetRig.push(l);
  }

  function signTex(d) {
    return canvasTex(512, 200, (g, w, h) => { g.fillStyle = '#232220'; g.fillRect(0, 0, w, h); g.fillStyle = '#d3a35c'; g.font = '600 64px "Space Grotesk", Arial, sans-serif'; g.fillText(d.code, 26, 84);
      g.fillStyle = '#f2ece2'; g.font = '500 40px Inter, Arial, sans-serif'; g.fillText(d.name, 26, 150, w - 40); }, 1, 1);
  }
  function mergeGroup(group) {
    group.updateMatrixWorld(true);
    const buckets = new Map(), meshes = [];
    group.traverse((o) => { if (o.isMesh) meshes.push(o); });
    meshes.forEach((m) => {
      let g = m.geometry.clone().applyMatrix4(m.matrixWorld); if (g.index) g = g.toNonIndexed();
      Object.keys(g.attributes).forEach((k) => { if (!['position', 'normal', 'uv'].includes(k)) g.deleteAttribute(k); });
      if (!g.attributes.uv) return;
      const key = m.material.uuid + (m.castShadow ? 'c' : 'n');
      if (!buckets.has(key)) buckets.set(key, { mat: m.material, cast: m.castShadow, list: [] });
      buckets.get(key).list.push(g); m.parent.remove(m); m.geometry.dispose();
    });
    while (group.children.length) group.remove(group.children[0]);
    buckets.forEach((b) => { const merged = THREE.BufferGeometryUtils.mergeBufferGeometries(b.list, false); if (!merged) return;
      const mesh = new THREE.Mesh(merged, b.mat); mesh.castShadow = b.cast; mesh.receiveShadow = b.mat !== S.glass; group.add(mesh); });
  }
  const HOUSES = DESIGNS.map((d, i) => {
    OX = (i - (N - 1) / 2) * PLOT; G = new THREE.Group(); scene.add(G); RIG = []; d.M = makeMats(d.p); M = d.M;
    d.build();
    const sm = new THREE.MeshStandardMaterial({ map: signTex(d), roughness: 0.6 });
    box(19.6, 19.8, -1.3, -1.1, 0, 3.4, M.metal); box(23.0, 23.2, -1.3, -1.1, 0, 3.4, M.metal); box(19.4, 23.4, -1.36, -1.2, 2.0, 3.6, sm);
    mergeGroup(G);
    return { d, ox: OX, group: G, rig: RIG };
  });

  // ================= lighting / time of day =================
  const hemi = new THREE.HemisphereLight('#dbe9ff', '#6b6150', 0.6); scene.add(hemi);
  const sun = new THREE.DirectionalLight('#fff3df', 2.2); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0006; scene.add(sun); scene.add(sun.target);
  const KEYS = [
    { sky: '#a9c4dc', sun: 2.2, sunCol: '#fff3df', sunPos: [-30, 45, 40], hemi: 0.6, hemiCol: '#dbe9ff', n: 0, exp: 1.0 },
    { sky: '#e6a77d', sun: 0.7, sunCol: '#ffb27a', sunPos: [45, 14, 40], hemi: 0.35, hemiCol: '#dbe9ff', n: 0.55, exp: 1.05 },
    { sky: '#0d1424', sun: 0.0, sunCol: '#ffb27a', sunPos: [45, 8, 40], hemi: 0.12, hemiCol: '#4a5a80', n: 1, exp: 1.25 }
  ];
  let tod = 0, focus = null;
  const cA = new THREE.Color(), cB = new THREE.Color(), mix = (a, b, t) => a + (b - a) * t;
  function setTime(k) {
    tod = k; const i = Math.min(1, Math.floor(k)), t = k - i, A = KEYS[i], B = KEYS[i + 1];
    const sky = cA.set(A.sky).lerp(cB.set(B.sky), t).clone(); scene.background = sky; stage.style.background = '#' + sky.getHexString();
    scene.fog = new THREE.Fog(sky, focus ? 160 : 420, focus ? 520 : 1100);
    sun.intensity = mix(A.sun, B.sun, t); sun.color.copy(cA.set(A.sunCol).lerp(cB.set(B.sunCol), t)); hemi.intensity = mix(A.hemi, B.hemi, t); hemi.color.copy(cA.set(A.hemiCol).lerp(cB.set(B.hemiCol), t));
    const n = mix(A.n, B.n, t); placeSun(A, B, t);
    HOUSES.forEach((h) => h.rig.forEach((r) => { r.light.intensity = r.on * n; }));
    streetRig.forEach((l) => { l.intensity = 14 * n; });
    S.lampOn.emissiveIntensity = n * 2.2; S.plate.emissiveIntensity = n * 0.45; S.lantern.emissiveIntensity = 0.15 + n * 2.4; S.glass.emissiveIntensity = n * 0.32;
    renderer.toneMappingExposure = mix(A.exp, B.exp, t);
    ['day', 'dusk', 'night'].forEach((m, j) => document.getElementById('btn-' + m).setAttribute('aria-pressed', Math.round(k) === j));
  }
  function placeSun(A, B, t) {
    const cx = focus ? focus.ox : 0, span = focus ? 42 : (N * PLOT) / 2 + 20;
    sun.target.position.set(cx, 0, -6);
    sun.position.set(cx + mix(A.sunPos[0], B.sunPos[0], t) * (focus ? 1 : 3), mix(A.sunPos[1], B.sunPos[1], t) * (focus ? 1 : 3), mix(A.sunPos[2], B.sunPos[2], t) * (focus ? 1 : 3));
    Object.assign(sun.shadow.camera, { left: -span, right: span, top: span, bottom: -span, near: 1, far: focus ? 180 : 600 }); sun.shadow.camera.updateProjectionMatrix();
  }

  // ================= camera + selection =================
  let fly = null;
  function flyTo(pos, tgt, ms = 1100) { fly = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos, t1: tgt, start: performance.now(), ms }; }
  function houseView(h, v) {
    const P = (x, z, y) => new THREE.Vector3(h.ox + x - 12, z, 22 - y);
    if (v === 'front') return [P(12, 7, -28), P(12, 8, 6)];
    if (v === 'entry') return [P(5.5, 5.5, -3.5), P(7, 5, 9.6)];
    return [P(31, 13, -21), P(12, 7, 10)];
  }
  const sel = document.getElementById('design');
  const optC = document.createElement('option'); optC.value = 'colony'; optC.textContent = 'Whole colony (all designs)'; sel.appendChild(optC);
  DESIGNS.forEach((d) => { const o = document.createElement('option'); o.value = d.code; o.textContent = `${d.code} – ${d.name}`; sel.appendChild(o); });
  const grid = document.getElementById('grid');
  DESIGNS.forEach((d) => {
    const b = document.createElement('button'); b.className = 'item'; b.dataset.code = d.code;
    b.innerHTML = `<div><span class="code">${d.code}</span><span class="nm"></span></div><div class="st"></div><div class="chips">${d.sw.map(([k]) => `<i style="background:${d.p[k] || '#ccc'}"></i>`).join('')}</div>`;
    b.querySelector('.nm').textContent = d.name; b.querySelector('.st').textContent = d.style;
    b.addEventListener('click', () => select(d.code)); grid.appendChild(b);
  });
  let lastView = 'corner';
  function setRigs(h) {
    HOUSES.forEach((x) => x.rig.forEach((r) => { r.light.visible = x === h; }));
  }
  function select(code, view) {
    const h = HOUSES.find((x) => x.d.code === code) || null; focus = h; sel.value = h ? code : 'colony';
    setRigs(h); setTime(tod);
    const tag = document.getElementById('tag');
    if (h) {
      const [p, t] = houseView(h, view || lastView); flyTo(p, t);
      tag.innerHTML = `<b>${h.d.code}</b> · `; tag.appendChild(document.createTextNode(h.d.name));
      showDetail(h.d);
    } else {
      flyTo(new THREE.Vector3(-30, 78, 150), new THREE.Vector3(0, 4, -12), 1400); tag.textContent = `Colony · ${N} designs on plan P5`;
      showDetail(null);
    }
    document.querySelectorAll('.item').forEach((b) => b.setAttribute('aria-current', b.dataset.code === code));

  }

      $('d-desc').textContent = 'Every house on this street has exactly the same floor plan (P5): 18 × 43 ft house, 6 ft front setback, 11 ft back garden. Only the exterior changes, so you can compare looks fairly. Pick any house to see it close up.';
      $('d-feat').innerHTML = ''; $('d-links').innerHTML = ''; $('d-sw').innerHTML = '';

    $('d-links').innerHTML = '';

    $('d-sw').innerHTML = d.sw.map(([k, label]) => `<i style="background:${d.p[k] || '#ccc'}"></i><span>${label}</span><span>${(d.p[k] || '').toUpperCase()}</span>`).join('');
  }
  sel.addEventListener('change', () => select(sel.value));
  const step = (k) => { const codes = ['colony'].concat(DESIGNS.map((d) => d.code)); const i = codes.indexOf(sel.value); select(codes[(i + k + codes.length) % codes.length]); };
  document.getElementById('prev').addEventListener('click', () => step(-1)); document.getElementById('next').addEventListener('click', () => step(1));
  document.querySelectorAll('.views button').forEach((b) => b.addEventListener('click', () => {
    const v = b.dataset.view; if (v === 'colony') return select('colony');

  }));
  ['day', 'dusk', 'night'].forEach((m, j) => document.getElementById('btn-' + m).addEventListener('click', () => setTime(j)));

  function resize() { const r = stage.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / Math.max(1, r.height); camera.updateProjectionMatrix(); }
  new ResizeObserver(resize).observe(stage); resize();

  const fromHash = (location.hash || '').replace('#', '').toUpperCase();
  let start = DESIGNS.some((d) => d.code === fromHash) ? fromHash : (fromHash === 'COLONY' ? 'colony' : null);
  if (!start) { try { start = localStorage.getItem('colony-design'); } catch (e) {} }

  window.addEventListener('hashchange', () => { const c = (location.hash || '').replace('#', '').toUpperCase(); if (DESIGNS.some((d) => d.code === c)) select(c); else if (c === 'COLONY') select('colony'); });

  (function loop(now) {
